<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group 8 Capstone - Planet Facts</title>

  <link rel="icon" type="image/svg+xml" href="images/logo_black.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/card.css">

<body>

  <!-- HEADER (Victor, Aisha) -->

  <!-- END HEADER -->

  

  <!-- SEARCH (Ayobami) -->
   <form class="search" role="search">
    <div class="search-input">
      <img src="images/SearchIcon.svg" class="search-icon" alt="" aria-hidden="true" >
      <input
      class="search-field"
      type="search"
      name="planet"
      placeholder="Search planet name..."
      aria-label="Search planet name" >
      <span class="search-error" role="alert" hidden>No results </span>
    </div>

    <button class="search-button" type="submit">Search</button>
   </form>
  <!-- END SEARCH -->



  <!-- CARD (Uyai, Afeez) -->
<section class="planet-card" aria-label="Planet information">

  <div class="card-content">

    <div class="card-image-container">
      <img
        class="card-image"
        src=""
        alt="Planet">
    </div>

    <div class="card-details">

      <h2 class="card-name"></h2>

      <p class="card-type"></p>

      <p class="card-description"></p>

      <div class="card-stats">

        <div class="card-stat">
          <span class="card-stat-label">Gravity</span>
          <span class="card-stat-value"></span>
        </div>

        <div class="card-stat">
          <span class="card-stat-label">Mass</span>
          <span class="card-stat-value"></span>
        </div>

        <div class="card-stat">
          <span class="card-stat-label">Period</span>
          <span class="card-stat-value"></span>
        </div>

      </div>

       <div class="card-icon-stats">

         <div class="card-icon-stat">
            <img
             src="images/TemperatureIcon.svg"
              alt=""
              class="card-icon">
           <span class="card-icon-value">

           </span>
         </div>

          <div class="card-icon-stat">
            <img
              src="images/Halfmoon.svg"
              alt=""
              class="card-icon">
            <span class="card-icon-value">

            </span>
          </div>

         <div class="card-icon-stat">
            <img
              src="images/Diameter.svg"
              alt=""
              class="card-icon">
            <span class="card-icon-value">

            </span>
          </div>

         <div class="card-icon-stat">
           <img
              src="images/CompanyIcon.svg"
             alt=""
              class="card-icon">
           <span class="card-icon-value">

           </span>
         </div>

       </div>

    </div>

  </div>

</section>
  <!-- END CARD -->



  <!-- TABLE (Hamida, Victoria) -->

  <!-- END TABLE -->

  <!-- END FOOTER -->

  <script src="js/api.js"></script>

</body>
</html>
