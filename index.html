<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Group 8 Capstone - Planet Facts</title>

    <link rel="icon" type="image/svg+xml" href="images/logo_black.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/search.css" />
    <link rel="stylesheet" href="css/card.css" />
    <link rel="stylesheet" href="css/table.css" />
    <link rel="stylesheet" href="css/footer.css" />
  </head>

  <body>
    <!-- HEADER (Victor, Aisha) -->
    <header>
      <button id="theme-toggle">🌙 Dark Mode</button>
    </header>
    <!-- END HEADER -->

    <!-- SEARCH (Ayobami) -->
    <form class="search" role="search">
      <div class="search-input">
        <img
          src="images/SearchIcon.svg"
          class="search-icon"
          alt=""
          aria-hidden="true"
        />
        <input
          class="search-field"
          type="search"
          name="planet"
          placeholder="Search planet name..."
          aria-label="Search planet name"
        />
        <span class="search-error" role="alert" hidden>No results </span>
      </div>

      <button class="search-button" type="submit">Search</button>
    </form>
    <!-- END SEARCH -->

    <!-- CARD (Uyai, Afeez) -->
    <section
      class="card"
      id="card"
      aria-label="Planet information"
      aria-live="polite"
    >
      <div class="card-content">
        <div class="card-image-container">
          <img
            class="card-image"
            id="card-image"
            src="images/ProfilePicture.svg"
            alt="Planet Earth"
          />
        </div>

        <div class="card-details">
          <h2 class="card-name" id="card-name">Earth</h2>

          <p class="card-type" id="card-type">Terrestrial</p>

          <p class="card-description" id="card-description">
            The only known planet to support life, with liquid water on the
            surface.
          </p>

          <div class="card-stats" role="group" aria-label="Planet statistics">
            <div class="card-stat">
              <span class="card-stat-label">Gravity</span>
              <span class="card-stat-value" id="card-gravity">9.8</span>
            </div>

            <div class="card-stat">
              <span class="card-stat-label">Mass</span>
              <span class="card-stat-value" id="card-mass">0.00315</span>
            </div>

            <div class="card-stat">
              <span class="card-stat-label">Period</span>
              <span class="card-stat-value" id="card-period">365</span>
            </div>
          </div>

          <div
            class="card-icon-stats"
            role="group"
            aria-label="More planet facts"
          >
            <div class="card-icon-stat">
              <img
                src="images/TemperatureIcon.svg"
                alt="Temperature"
                class="card-icon"
              />
              <span class="card-icon-value" id="card-temperature"> 288 </span>
            </div>

            <div class="card-icon-stat">
              <img src="images/Halfmoon.svg" alt="Moons" class="card-icon" />
              <span class="card-icon-value" id="card-moons"> 1 </span>
            </div>

            <div class="card-icon-stat">
              <img src="images/Diameter.svg" alt="Diameter" class="card-icon" />
              <span class="card-icon-value" id="card-diameter"> 12756 </span>
            </div>

            <div class="card-icon-stat">
              <img
                src="images/CompanyIcon.svg"
                alt="Distance from the sun"
                class="card-icon"
              />
              <span class="card-icon-value" id="card-distance"> 149.6 </span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <p class="card-loading" id="card-loading" role="status" hidden>
      Loading...
    </p>

    <div class="card-empty" id="card-empty" hidden>
      <h2 class="card-empty-title">No results found!</h2>
      <p class="card-empty-text">
        We couldn't find any planets matching your search. Please double-check
        the name and try again.
      </p>
    </div>
    <!-- END CARD -->

    <!-- TABLE (Hamida, Victoria) -->

    <!-- END TABLE -->

    <!-- FOOTER (Adannia, Teddy) -->

    <!-- END FOOTER -->

    <script src="js/theme.js"></script>
    <script src="js/api.js"></script>
  </body>
</html>
